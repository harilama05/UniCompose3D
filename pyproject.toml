[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unicompose3d"
dynamic = ["version", "dependencies"]
description = "Agentic 3D reconstruction and geometry-guided spatial composition"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "UniCompose3D contributors"}]
keywords = ["3d", "reconstruction", "spatial-reasoning", "agents", "composition"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

[project.scripts]
unicompose3d = "launch:main"

[tool.setuptools]
py-modules = ["launch"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["unicompose3d*", "tools*"]

[tool.setuptools.dynamic]
version = {attr = "unicompose3d.__version__"}
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.package-data]
unicompose3d = ["static/*", "static/vendor/**/*"]
